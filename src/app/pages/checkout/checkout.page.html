<ion-header class="ion-no-border">
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/cart"></ion-back-button>
    </ion-buttons>
    <ion-title>Datos de Entrega</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" color="dark">
  <!-- Campo: Dirección -->
  <div style="margin-bottom: 20px;">
    <ion-text color="light">
      <small style="color: #aaa;">Dirección</small>
    </ion-text>
    <ion-item color="light" style="--background: #f0f0f0; border-radius: 8px; margin-top: 6px;">
      <ion-input placeholder="Calle, número, colonia"></ion-input>
    </ion-item>
  </div>

  <!-- Campo: Teléfono -->
  <div style="margin-bottom: 20px;">
    <ion-text color="light">
      <small style="color: #aaa;">Teléfono</small>
    </ion-text>
    <ion-item color="light" style="--background: #f0f0f0; border-radius: 8px; margin-top: 6px;">
      <ion-input type="tel" placeholder="10 Dígitos"></ion-input>
    </ion-item>
  </div>

  <!-- Selección de Método de Pago -->
  <div style="margin-bottom: 20px;">
    <ion-text color="light">
      <small style="color: #aaa;">Método de pago</small>
    </ion-text>

    <ion-grid class="ion-no-padding" style="margin-top: 8px;">
      <ion-row>
        <ion-col size="6" style="padding-right: 4px;">
          <ion-button 
            expand="block" 
            [fill]="metodoPago === 'tarjeta' ? 'solid' : 'outline'" 
            color="medium" 
            (click)="seleccionarMetodo('tarjeta')">
            TARJETA
          </ion-button>
        </ion-col>
        <ion-col size="6" style="padding-left: 4px;">
          <ion-button 
            expand="block" 
            [fill]="metodoPago === 'efectivo' ? 'solid' : 'outline'" 
            color="light" 
            (click)="seleccionarMetodo('efectivo')">
            EFECTIVO
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

  <!-- Campo opcional si es en efectivo -->
  <div *ngIf="metodoPago === 'efectivo'" style="margin-bottom: 24px;">
    <ion-text color="light">
      <small style="color: #aaa;">¿Con cuánto vas a pagar?</small>
    </ion-text>
    <ion-item color="light" style="--background: #f0f0f0; border-radius: 8px; margin-top: 6px;">
      <ion-input type="number" placeholder="Ej. 300"></ion-input>
    </ion-item>
  </div>

  <!-- Botón Confirmar Pedido (Redirige al Menú) -->
  <ion-button expand="block" color="medium" routerLink="/menu" style="margin-top: 24px; font-weight: bold;">
    CONFIRMAR PEDIDO
  </ion-button>
</ion-content>

<!-- Menú Inferior (Footer Bar) -->
<ion-footer class="ion-no-border">
  <ion-toolbar color="light">
    <ion-grid class="ion-no-padding">
      <ion-row class="ion-text-center">
        <ion-col size="2.4">
          <ion-button fill="clear" color="dark" size="small" routerLink="/dashboard">
            <div style="display: flex; flex-direction: column; align-items: center;">
              <ion-icon name="homeOutline" style="font-size: 20px;"></ion-icon>
              <span style="font-size: 10px;">Inicio</span>
            </div>
          </ion-button>
        </ion-col>

        <ion-col size="2.4">
          <ion-button fill="clear" color="dark" size="small" routerLink="/menu">
            <div style="display: flex; flex-direction: column; align-items: center;">
              <ion-icon name="listOutline" style="font-size: 20px;"></ion-icon>
              <span style="font-size: 10px;">Menú</span>
            </div>
          </ion-button>
        </ion-col>

        <ion-col size="2.4">
          <ion-button fill="clear" color="dark" size="small" routerLink="/cart">
            <div style="display: flex; flex-direction: column; align-items: center;">
              <ion-icon name="cartOutline" style="font-size: 20px;"></ion-icon>
              <span style="font-size: 10px;">Carrito</span>
            </div>
          </ion-button>
        </ion-col>

        <ion-col size="2.4">
          <ion-button fill="clear" color="dark" size="small">
            <div style="display: flex; flex-direction: column; align-items: center;">
              <ion-icon name="squareOutline" style="font-size: 20px;"></ion-icon>
              <span style="font-size: 10px;">Pedidos</span>
            </div>
          </ion-button>
        </ion-col>

        <ion-col size="2.4">
          <ion-button fill="clear" color="dark" size="small">
            <div style="display: flex; flex-direction: column; align-items: center;">
              <ion-icon name="personCircleOutline" style="font-size: 20px;"></ion-icon>
              <span style="font-size: 10px;">Perfil</span>
            </div>
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
