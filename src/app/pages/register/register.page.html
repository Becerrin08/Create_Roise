<ion-content class="ion-padding ion-text-center">
  <ion-grid class="ion-no-padding">
    <ion-row class="ion-justify-content-center ion-align-items-center" style="min-height: 85vh;">
      <ion-col size="12" size-md="8" size-lg="6">

        <ion-text color="light">
          <h1 class="ion-no-margin" style="font-weight: 700; font-size: 2rem;">
            Registrarse
          </h1>
        </ion-text>

        <ion-card color="medium" class="ion-margin-vertical" style="height: 180px; display: flex; align-items: center; justify-content: center; border-radius: 8px;">
          <ion-icon name="image-outline" style="font-size: 90px; color: #b3c2cd;"></ion-icon>
        </ion-card>

        <ion-text color="light" class="ion-text-start">
          <p style="font-weight: 600; font-size: 0.95rem; margin-bottom: 6px;">Nombre</p>
        </ion-text>
        <ion-item fill="outline" color="dark" class="ion-margin-bottom" style="--border-color: #536473; --border-radius: 4px;">
          <ion-input type="text" placeholder="Tu nombre"></ion-input>
        </ion-item>

        <ion-text color="light" class="ion-text-start">
          <p style="font-weight: 600; font-size: 0.95rem; margin-bottom: 6px;">Correo</p>
        </ion-text>
        <ion-item fill="outline" color="dark" class="ion-margin-bottom" style="--border-color: #536473; --border-radius: 4px;">
          <ion-input type="email" placeholder="ejemplo@correo.com"></ion-input>
        </ion-item>

        <ion-text color="light" class="ion-text-start">
          <p style="font-weight: 600; font-size: 0.95rem; margin-bottom: 6px;">Contraseña</p>
        </ion-text>
        <ion-item fill="outline" color="dark" class="ion-margin-bottom" style="--border-color: #536473; --border-radius: 4px;">
          <ion-input type="password" placeholder="••••••••"></ion-input>
        </ion-item>

        <ion-button expand="block" fill="outline" color="light" class="ion-margin-top" style="--border-color: #7b8e9d;" routerLink="/dashboard">
          Registrarse
        </ion-button>

      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
