<ion-content class="ion-padding" style="--background: #212c37; padding-bottom: 80px;">
  <ion-grid style="height: 100%; display: flex; align-items: center;">
    <ion-row class="ion-justify-content-center" style="width: 100%;">
      <ion-col size="12" size-md="8" size-lg="6" class="ion-text-center">

        <!-- Título Perfil -->
        <ion-text color="light">
          <ion-text style="display: block; font-size: 2.2rem; font-weight: 700; margin-bottom: 35px;">
            Perfil
          </ion-text>
        </ion-text>

        <!-- Avatar Circular con Icono de Usuario -->
        <ion-avatar style="width: 180px; height: 180px; margin: 0 auto 30px auto; background-color: #4a5866; display: flex; align-items: center; justify-content: center;">
          <ion-icon name="person" style="font-size: 90px; color: #8fa0b0;"></ion-icon>
        </ion-avatar>

        <!-- Nombre del usuario -->
        <ion-text color="light">
          <ion-text style="display: block; font-size: 1.6rem; font-weight: 700; margin-bottom: 6px;">
            Axel Pastrana Chavez
          </ion-text>
        </ion-text>

        <!-- Correo del usuario -->
        <ion-text color="medium">
          <ion-text style="display: block; font-size: 0.95rem; font-weight: 500; margin-bottom: 45px;">
            axelpastranachavez@gmail.com
          </ion-text>
        </ion-text>

        <!-- Botón Cerrar Sesión -->
        <ion-button routerLink="/home" expand="block" fill="outline" color="light" style="--border-radius: 6px; font-weight: 600; height: 50px; text-transform: none; font-size: 1.15rem; --border-color: #6b7c8d;">
          Cerrar Sesión
        </ion-button>

      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
