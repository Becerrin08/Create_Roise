<ion-content class="ion-padding" style="--background: #000000; padding-bottom: 60px;">
  <ion-grid style="height: 100%; display: flex; align-items: center;">
    <ion-row class="ion-justify-content-center" style="width: 100%;">
      <ion-col size="12" size-md="8" size-lg="6" class="ion-text-center">
        
        <!-- Título Perfil -->
        <ion-text>
          <h1 style="color: #ffffff; display: block; font-size: 1.8rem; font-weight: 700; margin-top: 10px; margin-bottom: 30px;">
            Perfil
          </h1>
        </ion-text>

        <!-- Avatar Circular con Icono de Usuario -->
        <ion-avatar style="width: 130px; height: 130px; margin: 0 auto 20px auto; background-color: #1c1c1c; display: flex; align-items: center; justify-content: center; border: 2px solid #2a2a2a;">
          <ion-icon name="person" style="font-size: 70px; color: #aaaaaa;"></ion-icon>
        </ion-avatar>

        <!-- Nombre del usuario -->
        <ion-text>
          <h2 style="color: #ffffff; display: block; font-size: 1.4rem; font-weight: 700; margin-bottom: 6px;">
            {{ nombreUsuario || 'Bienvenido' }}
          </h2>
        </ion-text>

        <!-- Correo del usuario / Estatus -->
        <ion-text>
          <p style="color: #888888; display: block; font-size: 0.95rem; font-weight: 500; margin-bottom: 35px;">
            Sesión Activa
          </p>
        </ion-text>

        <!-- Botón Cerrar Sesión en Naranja Oficial -->
        <ion-button (click)="cerrarSesion()" expand="block"
          style="--background: #ff4500; --background-activated: #e03e00; --color: #ffffff; --border-radius: 14px; font-weight: 600; height: 50px; text-transform: none; font-size: 1.1rem; margin-bottom: 20px;">
          Cerrar Sesión
        </ion-button>

      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
