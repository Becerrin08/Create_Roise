<ion-header class="ion-no-border">
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" color="dark">
  <!-- Imagen Principal -->
  <ion-card style="margin: 0 0 16px 0; height: 180px; display: flex; align-items: center; justify-content: center; background-color: #333;">
    <ion-icon name="imageOutline" style="font-size: 64px; color: #666;"></ion-icon>
  </ion-card>

  <!-- Título y Descripción -->
  <ion-text color="light">
    <h2 style="font-weight: bold; margin-bottom: 4px;">Hamburguesa Clásica</h2>
    <p style="color: #aaa; margin-top: 0;">Carne de res de 150 g con queso cheddar, servida en pan brioche tostado.</p>
  </ion-text>

  <!-- Notas -->
  <div style="margin-top: 20px;">
    <ion-text color="light">
      <small style="color: #888;">Notas para la cocina</small>
    </ion-text>
    <ion-item color="light" style="--background: #f0f0f0; border-radius: 8px; margin-top: 6px;">
      <ion-input placeholder="bien cocida"></ion-input>
    </ion-item>
  </div>

  <!-- Cantidad -->
  <div style="margin-top: 24px; display: flex; justify-content: space-between; align-items: center;">
    <ion-text color="light">
      <span style="font-weight: bold;">Cantidad</span>
    </ion-text>
    <div style="display: flex; align-items: center; border: 1px solid #444; border-radius: 8px; padding: 4px 8px;">
      <ion-button fill="clear" size="small" color="light" (click)="decrementar()">
        <ion-icon name="removeOutline"></ion-icon>
      </ion-button>
      <span style="color: #fff; margin: 0 12px; font-weight: bold;">{{ cantidad }}</span>
      <ion-button fill="clear" size="small" color="light" (click)="incrementar()">
        <ion-icon name="addOutline"></ion-icon>
      </ion-button>
    </div>
  </div>

  <!-- Botón Continuar hacia el Carrito -->
  <ion-button expand="block" color="medium" routerLink="/cart" style="margin-top: 32px; font-weight: bold;">
    CONTINUAR
  </ion-button>
</ion-content>

<!-- Footer con Menú Inferior -->
<ion-footer class="ion-no-border">
  <ion-toolbar color="light">
    <ion-grid class="ion-no-padding">
      <ion-row class="ion-text-center">
        <ion-col size="2.4">
          <ion-button fill="clear" color="dark" size="small" routerLink="/dashboard">
            <div style="display: flex; flex-direction: column; align-items: center;">
              <ion-icon name="homeOutline" style="font-size: 20px;"></ion-icon>
              <span style="font-size: 10px;">Inicio</span>
            </div>
          </ion-button>
        </ion-col>

        <ion-col size="2.4">
          <ion-button fill="clear" color="dark" size="small" routerLink="/menu">
            <div style="display: flex; flex-direction: column; align-items: center;">
              <ion-icon name="listOutline" style="font-size: 20px;"></ion-icon>
              <span style="font-size: 10px;">Menú</span>
            </div>
          </ion-button>
        </ion-col>

        <ion-col size="2.4">
          <ion-button fill="clear" color="dark" size="small" routerLink="/cart">
            <div style="display: flex; flex-direction: column; align-items: center;">
              <ion-icon name="cartOutline" style="font-size: 20px;"></ion-icon>
              <span style="font-size: 10px;">Carrito</span>
            </div>
          </ion-button>
        </ion-col>

        <ion-col size="2.4">
          <ion-button fill="clear" color="dark" size="small">
            <div style="display: flex; flex-direction: column; align-items: center;">
              <ion-icon name="squareOutline" style="font-size: 20px;"></ion-icon>
              <span style="font-size: 10px;">Pedidos</span>
            </div>
          </ion-button>
        </ion-col>

        <ion-col size="2.4">
          <ion-button fill="clear" color="dark" size="small">
            <div style="display: flex; flex-direction: column; align-items: center;">
              <ion-icon name="personCircleOutline" style="font-size: 20px;"></ion-icon>
              <span style="font-size: 10px;">Perfil</span>
            </div>
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
