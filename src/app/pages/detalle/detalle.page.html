<ion-content class="ion-padding">
  <ion-grid class="ion-no-padding">
    
    <!-- Encabezado con Botón de Regresar y Título -->
    <ion-row class="ion-align-items-center ion-margin-bottom">
      <ion-col size="2">
        <ion-button fill="clear" color="light" routerLink="/menu" class="ion-no-margin ion-no-padding">
          <ion-icon name="arrow-back-circle-outline" style="font-size: 38px; color: #ffffff;"></ion-icon>
        </ion-button>
      </ion-col>
      <ion-col size="8" class="ion-text-center">
        <ion-text color="light">
          <h1 class="ion-no-margin" style="font-weight: 800; font-size: 2.2rem;">Detalle</h1>
        </ion-text>
      </ion-col>
      <ion-col size="2"></ion-col>
    </ion-row>

    <!-- Banner de Imagen del Producto -->
    <ion-row class="ion-margin-bottom">
      <ion-col size="12">
        <ion-card color="medium" class="ion-no-margin" style="height: 180px; display: flex; align-items: center; justify-content: center; border-radius: 8px;">
          <ion-icon name="image-outline" style="font-size: 80px; color: #b3c2cd;"></ion-icon>
        </ion-card>
      </ion-col>
    </ion-row>

    <!-- Nombre y Descripción del Producto -->
    <ion-row class="ion-margin-bottom">
      <ion-col size="12">
        <ion-text color="light">
          <h2 style="font-weight: 800; font-size: 1.4rem; margin-top: 0; margin-bottom: 8px;">Hamburguesa Clásica</h2>
          <p style="color: #a0b0bc; font-size: 0.95rem; line-height: 1.4; margin: 0;">
            Carne de res de 150 g con queso cheddar, servida en pan brioche tostado.
          </p>
        </ion-text>
      </ion-col>
    </ion-row>

    <!-- Campo: Notas para la cocina -->
    <ion-row class="ion-margin-top ion-margin-bottom">
      <ion-col size="12">
        <ion-text color="light">
          <p style="font-weight: 600; font-size: 0.95rem; margin-bottom: 8px;">Notas para la cocina</p>
        </ion-text>
        <ion-item fill="outline" color="dark" style="--border-color: #536473; --border-radius: 6px; --background: transparent;">
          <ion-textarea rows="4" placeholder="Ej. Sin cebolla, con poca mayonesa" style="color: #ffffff;"></ion-textarea>
        </ion-item>
      </ion-col>
    </ion-row>

    <!-- Selector de Cantidad (- 1 +) -->
    <ion-row class="ion-align-items-center ion-justify-content-between ion-margin-top ion-margin-bottom" style="padding: 10px 0;">
      <ion-col size="6">
        <ion-text color="light">
          <span style="font-weight: 700; font-size: 1.1rem;">Cantidad</span>
        </ion-text>
      </ion-col>
      <ion-col size="6" class="ion-text-end">
        <div style="display: inline-flex; align-items: center; border: 1px solid #536473; border-radius: 6px; padding: 4px 12px; background: transparent;">
          <ion-button fill="clear" size="small" color="light" style="--padding-start: 4px; --padding-end: 4px; font-weight: 700; font-size: 1.2rem; margin: 0;">-</ion-button>
          <span style="color: #ffffff; font-weight: 700; font-size: 1.1rem; margin: 0 16px;">1</span>
          <ion-button fill="clear" size="small" color="light" style="--padding-start: 4px; --padding-end: 4px; font-weight: 700; font-size: 1.2rem; margin: 0;">+</ion-button>
        </div>
      </ion-col>
    </ion-row>

    <!-- Botón Continuar -->
    <ion-row class="ion-margin-top ion-margin-bottom">
      <ion-col size="12">
        <ion-button expand="block" fill="solid" color="light" style="font-weight: 700; color: #23313d; --border-radius: 6px; height: 48px;">
          Continuar
        </ion-button>
      </ion-col>
    </ion-row>

  </ion-grid>
</ion-content>

<!-- Toolbar / Barra inferior de navegación -->
<ion-footer>
  <ion-toolbar color="dark">
    <ion-row class="ion-text-center">
      <ion-col>
        <ion-icon name="home-outline" style="font-size: 24px; color: #ffffff;"></ion-icon>
        <ion-text color="light"><p style="font-size: 0.75rem; margin: 0;">Perfil</p></ion-text>
      </ion-col>
      <ion-col>
        <ion-icon name="list-outline" style="font-size: 24px; color: #ffffff;"></ion-icon>
        <ion-text color="light"><p style="font-size: 0.75rem; margin: 0;">Menú</p></ion-text>
      </ion-col>
      <ion-col>
        <ion-icon name="cart-outline" style="font-size: 24px; color: #ffffff;"></ion-icon>
        <ion-text color="light"><p style="font-size: 0.75rem; margin: 0;">Carrito</p></ion-text>
      </ion-col>
      <ion-col>
        <ion-icon name="square-outline" style="font-size: 24px; color: #ffffff;"></ion-icon>
        <ion-text color="light"><p style="font-size: 0.75rem; margin: 0;">Pedidos</p></ion-text>
      </ion-col>
      <ion-col>
        <ion-icon name="person-circle-outline" style="font-size: 24px; color: #ffffff;"></ion-icon>
        <ion-text color="light"><p style="font-size: 0.75rem; margin: 0;">Perfil</p></ion-text>
      </ion-col>
    </ion-row>
  </ion-toolbar>
</ion-footer>
