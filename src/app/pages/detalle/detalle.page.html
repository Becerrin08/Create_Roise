<ion-content class="ion-padding" style="--background: #000000; padding-bottom: 8px;">
  <ion-grid>
    <!-- Header con botón de regresar -->
    <ion-row class="ion-align-items-center ion-margin-bottom" style="position: relative; margin-top: 5px; margin-bottom: 25px;">
      <ion-col size="auto" style="position: absolute; left: 0; z-index: 10;">
        <ion-button fill="clear" routerLink="/tabs/menu" style="--color: #ffffff; --background: #1c1c1c; --border-radius: 10px; width: 42px; height: 42px; --padding-start: 0; --padding-end: 0; margin: 0; border: none; --box-shadow: none;">
          <
          <ion-icon name="chevron-back-outline" style="font-size: 22px;"></ion-icon>
        </ion-button>
      </ion-col>
      <ion-col class="ion-text-center">
        <ion-text style="color: #ffffff; display: block; font-size: 1.8rem; font-weight: 700; margin: 0;">
          Detalle
        </ion-text>
      </ion-col>
    </ion-row>

    <!-- Imagen del Producto -->
    <ion-card style="background: #1c1c1c; height: 280px; border-radius: 14px; box-shadow: none; margin: 0 0 28px 0; display: flex; align-items: center; justify-content: center; border: 1px solid #2a2a2a; overflow: hidden;">
      <ion-card-content style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 0;">
        @if (producto?.imagen) {
          <img [src]="producto.imagen" style="width: 100%; height: 100%; object-fit: cover;" alt="Producto">
        } @else {
          <ion-icon name="image" style="font-size: 64px; color: #555555;"></ion-icon>
        }
      </ion-card-content>
    </ion-card>

    <!-- Título, Descripción y Precio Dinámicos -->
    <ion-text class="ion-text-start">
      <h2 style="color: #ffffff; display: block; font-size: 1.4rem; font-weight: 700; margin-bottom: 6px;">
        {{ producto?.nombre }}
      </h2>
    </ion-text>

    <div style="color: #00e676; font-size: 1.2rem; font-weight: 700; margin-bottom: 12px;">
      MX$ {{ producto?.precio ?? 0 }}
    </div>

    <p style="color: #aaaaaa; font-size: 0.95rem; line-height: 1.5; margin-bottom: 25px;">
      {{ producto?.descripcion }}
    </p>

    <!-- Notas para la cocina -->
    @if (producto?.categoria !== 'Bebidas') {
      <ion-text class="ion-text-start">
        <label style="color: #ffffff; display: block; font-weight: 600; font-size: 0.95rem; margin-bottom: 8px;">
          Notas para la cocina
        </label>
      </ion-text>

      <ion-item lines="none" style="background: #1c1c1c; border: 1px solid #2a2a2a; border-radius: 12px; margin-bottom: 25px; padding-start: 12px; --inner-padding-end: 12px;">
        <ion-textarea [(ngModel)]="notas" placeholder="Ej. Sin cebolla, con poca mayonesa" style="color: #ffffff; --placeholder-color: #666666; min-height: 70px;"></ion-textarea>
      </ion-item>
    }

    <!-- Selector de Cantidad -->
    <ion-row class="ion-align-items-center ion-justify-content-between" style="margin-bottom: 25px; background: #1c1c1c; padding: 12px 16px; border-radius: 12px; border: 1px solid #2a2a2a;">
      <ion-col size="auto">
        <ion-text>
          <h1 style="color: #ffffff; font-size: 1.3rem; font-weight: 600; margin: 0;">Cantidad</h1>
        </ion-text>
      </ion-col>
      <ion-col size="auto">
        <div style="display: flex; align-items: center; background: #282828; border-radius: 8px; padding: 2px 8px;">
          <ion-button (click)="disminuirCantidad()" fill="clear" style="--color: #ffffff; --padding-start: 6px; --padding-end: 6px; height: 32px; font-size: 1.7rem; margin: 0; box-shadow: none;">
            -
          </ion-button>
          <span style="color: #ffffff; font-size: 1.1rem; font-weight: 700; padding: 0 12px;">
            {{ cantidad }}
          </span>
          <ion-button (click)="aumentarCantidad()" fill="clear" style="--color: #ffffff; --padding-start: 6px; --padding-end: 6px; height: 32px; font-size: 1.7rem; margin: 0; box-shadow: none;">
            +
          </ion-button>
        </div>
      </ion-col>
    </ion-row>

    <!-- Botón Agregar al Carrito -->
    <ion-row>
      <ion-col size="12" style="padding: 0;">
        <ion-button (click)="agregarAlCarrito()" expand="block" style="--background: #ff4500; --background-activated: #e03e00; --color: #ffffff; --border-radius: 14px; font-weight: 600; height: 52px; text-transform: none; font-size: 1.15rem; margin-bottom: 25px; box-shadow: none;">
          Agregar al carrito (MX$ {{ (producto?.precio ?? 0) * cantidad }})
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
