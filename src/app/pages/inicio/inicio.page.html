<ion-content class="ion-padding" style="--background: #212c37; padding-bottom: 80px;">
  <ion-grid>
    <ion-row class="ion-justify-content-center">
      <ion-col size="12" size-md="8" size-lg="6" class="ion-text-center">

        <!-- Título Inicio -->
        <ion-text color="light">
          <ion-text style="display: block; font-size: 2.2rem; font-weight: 700; margin-top: 10px; margin-bottom: 20px;">
            Inicio
          </ion-text>
        </ion-text>

        <!-- Subtítulo "Hola de Nuevo!!" -->
        <ion-text color="light" class="ion-text-start">
          <ion-text style="display: block; font-size: 1.1rem; font-weight: 600; margin-bottom: 12px;">
            Hola de Nuevo!!
          </ion-text>
        </ion-text>

        <!-- Imagen Banner Principal -->
        <ion-card
          style="--background: #4a5866; height: 180px; border-radius: 4px; box-shadow: none; margin: 0 0 25px 0; display: flex; align-items: center; justify-content: center;">
          <ion-card-content>
            <ion-icon name="image" style="font-size: 80px; color: #8fa0b0;"></ion-icon>
          </ion-card-content>
        </ion-card>

        <!-- Sección Categorías -->
        <ion-text color="light" class="ion-text-start">
          <ion-text style="display: block; font-size: 1.2rem; font-weight: 700; margin-bottom: 15px;">
            Categorias
          </ion-text>
        </ion-text>

        <!-- Categoría 1: Hamburguesas -->
        <ion-row class="ion-align-items-center" style="margin-bottom: 12px;">
          <ion-col size="auto">
            <ion-badge
              style="--background: #eef2f5; --color: #212c37; font-size: 0.85rem; padding: 6px 14px; font-weight: 700; border-radius: 4px;">
              Hamburguesas
            </ion-badge>
          </ion-col>
          <ion-col>
            <div style="width: 100%; height: 1px; background-color: #5a6978;"></div>
          </ion-col>
        </ion-row>

        <!-- Tarjetas Hamburguesas (3 columnas) -->
        <ion-row class="ion-margin-bottom">
          <ion-col size="4">
            <ion-card
              style="--background: #4a5866; height: 75px; border-radius: 4px; box-shadow: none; margin: 0; display: flex; align-items: center; justify-content: center;">
              <ion-icon name="image" style="font-size: 32px; color: #8fa0b0;"></ion-icon>
            </ion-card>
          </ion-col>
          <ion-col size="4">
            <ion-card
              style="--background: #4a5866; height: 75px; border-radius: 4px; box-shadow: none; margin: 0; display: flex; align-items: center; justify-content: center;">
              <ion-icon name="image" style="font-size: 32px; color: #8fa0b0;"></ion-icon>
            </ion-card>
          </ion-col>
          <ion-col size="4">
            <ion-card
              style="--background: #4a5866; height: 75px; border-radius: 4px; box-shadow: none; margin: 0; display: flex; align-items: center; justify-content: center;">
              <ion-icon name="image" style="font-size: 32px; color: #8fa0b0;"></ion-icon>
            </ion-card>
          </ion-col>
        </ion-row>

        <!-- Categoría 2: Alitas -->
        <ion-row class="ion-align-items-center" style="margin-bottom: 12px;">
          <ion-col size="auto">
            <ion-badge
              style="--background: #eef2f5; --color: #212c37; font-size: 0.85rem; padding: 6px 18px; font-weight: 700; border-radius: 4px;">
              Alitas
            </ion-badge>
          </ion-col>
          <ion-col>
            <div style="width: 100%; height: 1px; background-color: #5a6978;"></div>
          </ion-col>
        </ion-row>

        <!-- Tarjetas Alitas (3 columnas) -->
        <ion-row style="margin-bottom: 25px;">
          <ion-col size="4">
            <ion-card
              style="--background: #4a5866; height: 75px; border-radius: 4px; box-shadow: none; margin: 0; display: flex; align-items: center; justify-content: center;">
              <ion-icon name="image" style="font-size: 32px; color: #8fa0b0;"></ion-icon>
            </ion-card>
          </ion-col>
          <ion-col size="4">
            <ion-card
              style="--background: #4a5866; height: 75px; border-radius: 4px; box-shadow: none; margin: 0; display: flex; align-items: center; justify-content: center;">
              <ion-icon name="image" style="font-size: 32px; color: #8fa0b0;"></ion-icon>
            </ion-card>
          </ion-col>
          <ion-col size="4">
            <ion-card
              style="--background: #4a5866; height: 75px; border-radius: 4px; box-shadow: none; margin: 0; display: flex; align-items: center; justify-content: center;">
              <ion-icon name="image" style="font-size: 32px; color: #8fa0b0;"></ion-icon>
            </ion-card>
          </ion-col>
        </ion-row>

        <!-- Botón Ver menú completo -->
        <ion-button routerLink="/tabs/menu" expand="block" fill="outline" color="light"
          style="--border-radius: 6px; font-weight: 600; height: 46px; text-transform: none; font-size: 1.05rem; --border-color: #6b7c8d; margin-bottom: 20px;">
          Ver menú completo
        </ion-button>

      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
