<ion-content class="ion-padding">
  <ion-grid class="ion-no-padding">
    
    <!-- Título principal -->
    <ion-row class="ion-justify-content-center ion-text-center ion-margin-bottom">
      <ion-col size="12">
        <ion-text color="light">
          <h1 class="ion-no-margin" style="font-weight: 800; font-size: 2.2rem;">Menú</h1>
        </ion-text>
      </ion-col>
    </ion-row>

    <!-- Lista de Productos -->
    <ion-list style="background: transparent;">

      <!-- Producto 1: Hamburguesa Clásica -->
      <ion-item class="ion-margin-bottom" style="--background: transparent; --border-color: #536473; --inner-padding-end: 0;">
        <ion-card slot="start" color="medium" class="ion-no-margin" routerLink="/detalle" style="width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer;">
          <ion-icon name="image-outline" style="font-size: 30px; color: #b3c2cd;"></ion-icon>
        </ion-card>
        <ion-label class="ion-padding-start" routerLink="/detalle" style="cursor: pointer;">
          <ion-badge color="light" style="color: #23313d; font-weight: 700; font-size: 0.8rem; margin-bottom: 6px;">
            Hamburguesas Clásica
          </ion-badge>
          <h2 style="color: #ffffff; font-weight: 700; font-size: 1.3rem; margin: 0;">$120.00</h2>
        </ion-label>
        <ion-button slot="end" fill="outline" color="light" routerLink="/detalle" style="--border-color: #7b8e9d; --border-radius: 6px; height: 40px; width: 40px; --padding-start: 0; --padding-end: 0;">
          <ion-icon name="add-outline" style="font-size: 20px;"></ion-icon>
        </ion-button>
      </ion-item>

<!-- Barra inferior de navegación funcional -->
<ion-footer>
  <ion-toolbar style="--background: #ffffff; --border-color: #e2e8f0;">
    <ion-row class="ion-text-center ion-align-items-center">
      <ion-col routerLink="/dashboard" style="cursor: pointer;">
        <ion-icon name="home-outline" style="font-size: 22px; color: #64748b;"></ion-icon>
        <p style="font-size: 0.75rem; margin: 2px 0 0 0; color: #64748b;">Inicio</p>
      </ion-col>
      <ion-col routerLink="/menu" style="cursor: pointer;">
        <ion-icon name="list-outline" style="font-size: 22px; color: #334155;"></ion-icon>
        <p style="font-size: 0.75rem; margin: 2px 0 0 0; color: #334155; font-weight: 600;">Menú</p>
      </ion-col>
      <ion-col style="cursor: pointer;">
        <ion-icon name="cart-outline" style="font-size: 22px; color: #64748b;"></ion-icon>
        <p style="font-size: 0.75rem; margin: 2px 0 0 0; color: #64748b;">Carrito</p>
      </ion-col>
      <ion-col style="cursor: pointer;">
        <ion-icon name="square-outline" style="font-size: 22px; color: #64748b;"></ion-icon>
        <p style="font-size: 0.75rem; margin: 2px 0 0 0; color: #64748b;">Pedidos</p>
      </ion-col>
      <ion-col style="cursor: pointer;">
        <ion-icon name="person-circle-outline" style="font-size: 22px; color: #64748b;"></ion-icon>
        <p style="font-size: 0.75rem; margin: 2px 0 0 0; color: #64748b;">Perfil</p>
      </ion-col>
    </ion-row>
  </ion-toolbar>
</ion-footer>
