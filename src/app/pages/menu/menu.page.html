<ion-content class="ion-padding" style="--background: #212c37;">
  <ion-grid>
    <ion-row class="ion-justify-content-center">
      <ion-col size="12" size-md="8" size-lg="6" class="ion-text-center">

        <!-- Título Menú -->
        <ion-text color="light">
          <ion-text style="display: block; font-size: 2.2rem; font-weight: 700; margin-top: 10px; margin-bottom: 25px;">
            Menú
          </ion-text>
        </ion-text>

        <!-- Item 1: Hamburguesas Clásica -->
        <ion-row class="ion-align-items-center ion-margin-bottom" style="border-bottom: 1px solid #3d4a57; padding-bottom: 15px;">
          <ion-col size="4">
            <ion-card style="--background: #4a5866; height: 80px; border-radius: 4px; box-shadow: none; margin: 0; display: flex; align-items: center; justify-content: center;">
              <ion-icon name="image" style="font-size: 35px; color: #8fa0b0;"></ion-icon>
            </ion-card>
          </ion-col>
          <ion-col size="5" class="ion-text-start" style="padding-left: 10px;">
            <ion-badge style="--background: #eef2f5; --color: #212c37; font-size: 0.8rem; padding: 5px 10px; font-weight: 700; border-radius: 4px; margin-bottom: 8px;">
              <ion-icon name="fast-food-outline" style="margin-right: 4px; font-size: 0.85rem;"></ion-icon>
              Hamburguesas Clásica
            </ion-badge>
            <ion-text color="light">
              <div style="font-size: 1.3rem; font-weight: 700;">$120.00</div>
            </ion-text>
          </ion-col>
          <ion-col size="3" class="ion-text-end">
            <ion-button fill="outline" color="light" style="--border-radius: 6px; width: 44px; height: 44px; --border-color: #6b7c8d; --padding-start: 0; --padding-end: 0; margin: 0;">
              <ion-icon name="add-outline" style="font-size: 22px;"></ion-icon>
            </ion-button>
          </ion-col>
        </ion-row>
