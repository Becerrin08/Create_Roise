<ion-content class="ion-padding" style="--background: #000000;">
  <ion-grid>
    <ion-row class="ion-justify-content-center">
      <ion-col size="12" size-md="10" size-lg="8">
        
        <!-- Título Menú -->
        <ion-text>
          <h1 style="color: #ffffff; display: block; font-size: 1.8rem; font-weight: 700; text-align: center; margin-top: 10px; margin-bottom: 25px;">
            Menú
          </h1>
        </ion-text>

        <!-- Render dinámico de productos -->
        <div *ngFor="let prod of productos"
          style="display: flex; align-items: center; justify-content: space-between; background: #1c1c1c; border-radius: 14px; padding: 12px; margin-bottom: 15px; border: 1px solid #2a2a2a;">
          
          <!-- Imagen / Icono del producto (Clickeable) -->
          <div (click)="seleccionarProducto(prod)"
            style="width: 75px; height: 75px; background: #252525; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; overflow: hidden;">
            @if (prod.imagen) {
              <img [src]="prod.imagen" style="width: 100%; height: 100%; object-fit: cover;" [alt]="prod.nombre">
            } @else {
              <ion-icon name="image" style="font-size: 32px; color: #555555;"></ion-icon>
            }
          </div>

          <!-- Información del Producto -->
          <div style="flex-grow: 1; padding: 0 15px; cursor: pointer;" (click)="seleccionarProducto(prod)">
            
            <!-- Badge de categoría / nombre del producto -->
            <ion-badge style="background: #282828; color: #ffffff; font-size: 0.8rem; padding: 5px 10px; font-weight: 600; border-radius: 6px; display: inline-flex; align-items: center; margin-bottom: 4px;">
              <ion-icon [name]="obtenerIconoCategoria(prod)" style="margin-right: 4px; font-size: 0.85rem; color: #ff4500;"></ion-icon>
              {{ prod.nombre }}
            </ion-badge>

            <!-- Precio -->
            <div style="color: #00e676; font-size: 1.1rem; font-weight: 700;">
              {{ prod.precio | currency:'MXN':'symbol':'1.2-2' }}
            </div>
          </div>

          <!-- Botón de acción (+) en Naranja Oficial -->
          <div>
            <ion-button (click)="seleccionarProducto(prod)" fill="solid"
              style="--background: #ff4500; --background-activated: #e03e00; --color: #ffffff; --border-radius: 10px; width: 44px; height: 44px; --padding-start: 0; --padding-end: 0; margin: 0;">
              <ion-icon name="add-outline" style="font-size: 24px;"></ion-icon>
            </ion-button>
          </div>

        </div>

      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
