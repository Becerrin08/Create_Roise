<ion-content class="ion-padding">
  <ion-grid class="ion-no-padding">
    
    <!-- Título principal -->
    <ion-row class="ion-justify-content-center ion-text-center">
      <ion-col size="12">
        <ion-text color="light">
          <h1 class="ion-no-margin" style="font-weight: 800; font-size: 2.2rem;">Inicio</h1>
        </ion-text>
      </ion-col>
    </ion-row>

    <!-- Saludo y Banner Principal -->
    <ion-row class="ion-margin-top">
      <ion-col size="12">
        <ion-text color="light">
          <p style="font-weight: 700; font-size: 1.1rem; margin-bottom: 8px;">Hola de Nuevo!!</p>
        </ion-text>
        <ion-card color="medium" class="ion-no-margin" style="height: 160px; display: flex; align-items: center; justify-content: center; border-radius: 8px;">
          <ion-icon name="image-outline" style="font-size: 80px; color: #b3c2cd;"></ion-icon>
        </ion-card>
      </ion-col>
    </ion-row>

    <!-- Sección Categorías -->
    <ion-row class="ion-margin-top">
      <ion-col size="12">
        <ion-text color="light">
          <h2 style="font-weight: 800; font-size: 1.3rem; margin-bottom: 12px;">Categorias</h2>
        </ion-text>
      </ion-col>
    </ion-row>

    <!-- Categoría: Hamburguesas -->
    <ion-row class="ion-align-items-center ion-margin-bottom">
      <ion-col size="auto">
        <ion-badge color="light" class="ion-padding-horizontal ion-padding-vertical" style="color: #23313d; font-weight: 700; font-size: 0.9rem; border-radius: 4px;">
          Hamburguesas
        </ion-badge>
      </ion-col>
      <ion-col>
        <hr style="border-color: #536473; opacity: 0.5; margin: 0;">
      </ion-col>
    </ion-row>

    <!-- Grid Hamburguesas -->
    <ion-row class="ion-margin-bottom">
      <ion-col size="4">
        <ion-card color="medium" class="ion-no-margin" style="height: 75px; display: flex; align-items: center; justify-content: center; border-radius: 6px;">
          <ion-icon name="image-outline" style="font-size: 35px; color: #b3c2cd;"></ion-icon>
        </ion-card>
      </ion-col>
      <ion-col size="4">
        <ion-card color="medium" class="ion-no-margin" style="height: 75px; display: flex; align-items: center; justify-content: center; border-radius: 6px;">
          <ion-icon name="image-outline" style="font-size: 35px; color: #b3c2cd;"></ion-icon>
        </ion-card>
      </ion-col>
      <ion-col size="4">
        <ion-card color="medium" class="ion-no-margin" style="height: 75px; display: flex; align-items: center; justify-content: center; border-radius: 6px;">
          <ion-icon name="image-outline" style="font-size: 35px; color: #b3c2cd;"></ion-icon>
        </ion-card>
      </ion-col>
    </ion-row>

    <!-- Categoría: Alitas -->
    <ion-row class="ion-align-items-center ion-margin-bottom">
      <ion-col size="auto">
        <ion-badge color="light" class="ion-padding-horizontal ion-padding-vertical" style="color: #23313d; font-weight: 700; font-size: 0.9rem; border-radius: 4px;">
          Alitas
        </ion-badge>
      </ion-col>
      <ion-col>
        <hr style="border-color: #536473; opacity: 0.5; margin: 0;">
      </ion-col>
    </ion-row>

    <!-- Grid Alitas -->
    <ion-row class="ion-margin-bottom">
      <ion-col size="4">
        <ion-card color="medium" class="ion-no-margin" style="height: 75px; display: flex; align-items: center; justify-content: center; border-radius: 6px;">
          <ion-icon name="image-outline" style="font-size: 35px; color: #b3c2cd;"></ion-icon>
        </ion-card>
      </ion-col>
      <ion-col size="4">
        <ion-card color="medium" class="ion-no-margin" style="height: 75px; display: flex; align-items: center; justify-content: center; border-radius: 6px;">
          <ion-icon name="image-outline" style="font-size: 35px; color: #b3c2cd;"></ion-icon>
        </ion-card>
      </ion-col>
      <ion-col size="4">
        <ion-card color="medium" class="ion-no-margin" style="height: 75px; display: flex; align-items: center; justify-content: center; border-radius: 6px;">
          <ion-icon name="image-outline" style="font-size: 35px; color: #b3c2cd;"></ion-icon>
        </ion-card>
      </ion-col>
    </ion-row>

    <!-- Botón Ver menú completo redireccionando a /menu -->
    <ion-row class="ion-margin-top ion-margin-bottom">
      <ion-col size="12">
        <ion-button expand="block" fill="outline" color="light" style="--border-color: #7b8e9d; font-weight: 600;" routerLink="/menu">
          Ver menú completo
        </ion-button>
      </ion-col>
    </ion-row>

  </ion-grid>
</ion-content>

<!-- Barra inferior de navegación -->
<ion-footer>
  <ion-toolbar style="--background: #ffffff; --border-color: #e2e8f0;">
    <ion-row class="ion-text-center ion-align-items-center">
      <ion-col routerLink="/dashboard" style="cursor: pointer;">
        <ion-icon name="home-outline" style="font-size: 22px; color: #334155;"></ion-icon>
        <p style="font-size: 0.75rem; margin: 2px 0 0 0; color: #334155; font-weight: 600;">Inicio</p>
      </ion-col>
      <ion-col routerLink="/menu" style="cursor: pointer;">
        <ion-icon name="list-outline" style="font-size: 22px; color: #64748b;"></ion-icon>
        <p style="font-size: 0.75rem; margin: 2px 0 0 0; color: #64748b;">Menú</p>
      </ion-col>
      <ion-col style="cursor: pointer;">
        <ion-icon name="cart-outline" style="font-size: 22px; color: #64748b;"></ion-icon>
        <p style="font-size: 0.75rem; margin: 2px 0 0 0; color: #64748b;">Carrito</p>
      </ion-col>
      <ion-col style="cursor: pointer;">
        <ion-icon name="square-outline" style="font-size: 22px; color: #64748b;"></ion-icon>
        <p style="font-size: 0.75rem; margin: 2px 0 0 0; color: #64748b;">Pedidos</p>
      </ion-col>
      <ion-col style="cursor: pointer;">
        <ion-icon name="person-circle-outline" style="font-size: 22px; color: #64748b;"></ion-icon>
        <p style="font-size: 0.75rem; margin: 2px 0 0 0; color: #64748b;">Perfil</p>
      </ion-col>
    </ion-row>
  </ion-toolbar>
</ion-footer>
