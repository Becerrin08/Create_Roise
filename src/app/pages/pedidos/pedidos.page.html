<ion-content class="ion-padding" style="--background: #212c37; padding-bottom: 80px;">
  <ion-grid>
    <ion-row class="ion-justify-content-center">
      <ion-col size="12" size-md="8" size-lg="6" class="ion-text-center">

        <!-- Título Mis Pedidos -->
        <ion-text color="light">
          <ion-text style="display: block; font-size: 2.2rem; font-weight: 700; margin-top: 10px; margin-bottom: 30px;">
            Mis Pedidos
          </ion-text>
        </ion-text>

        <!-- Pedido #98 -->
        <ion-row class="ion-align-items-center ion-justify-content-between ion-margin-bottom" style="border-bottom: 1px solid #3d4a57; padding-bottom: 16px;">
          <ion-col size="auto">
            <ion-text color="light">
              <div style="font-size: 1.4rem; font-weight: 700;">Pedido #98</div>
            </ion-text>
          </ion-col>
          <ion-col size="auto">
            <ion-button fill="outline" color="light" style="--border-radius: 4px; font-weight: 600; height: 36px; text-transform: none; font-size: 0.85rem; --border-color: #6b7c8d; margin: 0;">
              Entregado

          </ion-col>
        </ion-row>

        <!-- Pedido #97 -->
        <ion-row class="ion-align-items-center ion-justify-content-between ion-margin-bottom" style="border-bottom: 1px solid #3d4a57; padding-bottom: 16px;">
          <ion-col size="auto">
            <ion-text color="light">
              <div style="font-size: 1.4rem; font-weight: 700;">Pedido #97</div>
            </ion-text>
          </ion-col>
          <ion-col size="auto">
            <ion-button fill="outline" color="light" style="--border-radius: 4px; font-weight: 600; height: 36px; text-transform: none; font-size: 0.85rem; --border-color: #6b7c8d; margin: 0;">
              Entregado
            </ion-button>
          </ion-col>
        </ion-row>

      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
