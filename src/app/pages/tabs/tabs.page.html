<ion-tabs>

  <ion-tab-bar slot="bottom" style="--background: #000000; border: none; border-top: 1px solid #1c1c1c; height: 65px;">
    
    <!-- Pestaña Inicio -->
    <ion-tab-button tab="inicio" href="/tabs/inicio" style="--color: #777777; --color-selected: #ff4500;">
      <ion-icon name="home" style="font-size: 22px;"></ion-icon>
      <ion-label style="font-size: 0.75rem; font-weight: 500;">Inicio</ion-label>
    </ion-tab-button>

    <!-- Pestaña Menú -->
    <ion-tab-button tab="menu" href="/tabs/menu" style="--color: #777777; --color-selected: #ff4500;">
      <ion-icon name="list-outline" style="font-size: 22px;"></ion-icon>
      <ion-label style="font-size: 0.75rem; font-weight: 500;">Menú</ion-label>
    </ion-tab-button>

    <!-- Pestaña Carrito -->
    <ion-tab-button tab="carrito" href="/tabs/carrito" style="--color: #777777; --color-selected: #ff4500;">
      <ion-icon name="cart-outline" style="font-size: 22px;"></ion-icon>
      <ion-label style="font-size: 0.75rem; font-weight: 500;">Carrito</ion-label>
    </ion-tab-button>

    <!-- Pestaña Pedidos -->
    <ion-tab-button tab="pedidos" href="/tabs/pedidos" style="--color: #777777; --color-selected: #ff4500;">
      <ion-icon name="square-outline" style="font-size: 22px;"></ion-icon>
      <ion-label style="font-size: 0.75rem; font-weight: 500;">Pedidos</ion-label>
    </ion-tab-button>

    <!-- Pestaña Perfil -->
    <ion-tab-button tab="perfil" href="/tabs/perfil" style="--color: #777777; --color-selected: #ff4500;">
      <ion-icon name="person-circle-outline" style="font-size: 22px;"></ion-icon>
      <ion-label style="font-size: 0.75rem; font-weight: 500;">Perfil</ion-label>
    </ion-tab-button>

  </ion-tab-bar>

</ion-tabs>
