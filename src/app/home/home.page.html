<ion-content class="ion-padding ion-text-center">
  <ion-grid class="ion-no-padding">
    <ion-row class="ion-justify-content-center ion-align-items-center" style="min-height: 85vh;">
      <ion-col size="12" size-md="8" size-lg="6">

        <!-- Título con ion-text e ion-text-center -->
        <ion-text color="light">
          <h1 class="ion-no-margin" style="font-weight: 800; font-size: 2.2rem; line-height: 1.2;">
            Wing´s Burger<br>
            &<br>
            Beers
          </h1>
        </ion-text>

        <!-- Cuadro del Logo con ion-card e ion-icon -->
        <ion-card color="medium" class="ion-margin-vertical ion-padding-vertical"
          style="height: 200px; display: flex; align-items: center; justify-content: center; border-radius: 8px;">
          <ion-icon name="image-outline" style="font-size: 90px; color: #b3c2cd;"></ion-icon>
        </ion-card>

        <!-- Botón Iniciar Sesión con Redirección -->
        <ion-button expand="block" fill="outline" color="light" class="ion-margin-top" routerLink="/login">
          Iniciar Sesión
        </ion-button>

        <!-- Divisor decorativo con ion-row y ion-icon -->
        <ion-row class="ion-align-items-center ion-margin-vertical">
          <ion-col>
            <hr style="border-color: #536473; opacity: 0.5;">
          </ion-col>
          <ion-col size="auto">
            <ion-icon name="ellipse-outline" color="medium" style="font-size: 14px;"></ion-icon>
          </ion-col>
          <ion-col>
            <hr style="border-color: #536473; opacity: 0.5;">
          </ion-col>
        </ion-row>

        <!-- Botón Registrarse -->
        <ion-button expand="block" fill="solid" color="light" routerLink="/register">
          Registrarse
        </ion-button>

      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
