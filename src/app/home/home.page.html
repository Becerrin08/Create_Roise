<ion-content class="ion-padding" style="--background: #000000;">
  <ion-grid style="height: 100%; display: flex; align-items: center; justify-content: center;">
    <ion-row class="ion-justify-content-center" style="width: 100%;">
      <ion-col size="12" size-md="8" size-lg="5" class="ion-text-center">

        <!-- Logo Oficial Más Grande y Resaltado -->
        <div
          style="height: 230px; margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center;">
          <img src="assets/images/logoWings.jpg" alt="Logo Wing's Burger & Beers"
            style="max-height: 100%; max-width: 100%; object-fit: contain;" />
        </div>

        <!-- Subtítulo de bienvenida -->
        <ion-text>
          <p style="color: #888888; font-size: 1.1rem; font-weight: 600; margin-top: 0; margin-bottom: 45px;">
            ¡Las mejores alitas y hamburguesas!
          </p>
        </ion-text>

        <!-- Botón Iniciar Sesión -->
<ion-button expand="block" routerLink="/iniciarSesion"
  style="--background: #ff4500; --background-activated: #e03e00; --color: #ffffff; --border-radius: 14px; font-weight: 600; height: 52px; text-transform: none; font-size: 1.15rem; margin-bottom: 18px;">
  Iniciar Sesión
</ion-button>

<!-- Separador estético con "o" -->
<div style="display: flex; align-items: center; justify-content: center; margin: 18px 0;">
  <div style="flex-grow: 1; height: 1px; background: #2a2a2a;"></div>
  <span style="color: #666666; padding: 0 12px; font-size: 0.9rem; font-weight: 500;">o</span>
  <div style="flex-grow: 1; height: 1px; background: #2a2a2a;"></div>
</div>

<!-- Botón Registrarse -->
<ion-button expand="block" fill="outline" routerLink="/registrarse"
  style="--border-color: #444444; --border-width: 1.5px; --color: #ffffff; --border-radius: 14px; font-weight: 600; height: 52px; text-transform: none; font-size: 1.15rem; margin-top: 18px;">
  Registrarse
</ion-button>

      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
